format:
  html:
    theme: none
    css:
      - style.css
      - quarto-overrides.css
    toc: false
    page-layout: full
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    include-before-body:
      text: |
        <nav>
          <a href="index.html" class="nav-logo"><span class="dot"></span>SciComm Collective</a>
          <ul class="nav-links">
            <li><a href="blog.html">Blog</a></li>
            <li><a href="podcast.html">Podcast</a></li>
            <li><a href="workshops.html">Workshops</a></li>
            <li><a href="cafe.html">Science Café</a></li>
            <li><a href="about.html">About</a></li>
          </ul>
          <a href="cafe.html#rsvp" class="nav-join">Join us</a>
        </nav>

    include-after-body:
      text: |
        <footer>
          <a href="index.html" class="footer-logo"><span class="dot"></span>SciComm Collective</a>
          <ul class="footer-links">
            <li><a href="blog.html">Blog</a></li>
            <li><a href="podcast.html">Podcast</a></li>
            <li><a href="workshops.html">Workshops</a></li>
            <li><a href="cafe.html">Science Café</a></li>
            <li><a href="about.html">About</a></li>
          </ul>
          <span class="footer-copy">&copy; 2026 SciComm Collective</span>
        </footer>